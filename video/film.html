<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accidental Deaths in Japan, explainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Preview shell only. The film is one canvas; ?render switches to frame-by-frame capture. */
html,body{margin:0;height:100%;background:#05070d;color:#9aa3bf;font:13px/1.4 ui-monospace,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
canvas{width:min(96vw,calc((100vh - 64px)*var(--ar,1.7778)));aspect-ratio:var(--ar,1.7778);display:block}
.ctl{display:flex;gap:12px;align-items:center;width:min(96vw,calc((100vh - 64px)*var(--ar,1.7778)))}
.ctl input{flex:1}
.ctl button{font:inherit;color:#e8ebf5;background:#11162a;border:1px solid #262f4d;border-radius:6px;padding:4px 10px;cursor:pointer}
body.render{display:block} body.render .ctl{display:none} body.render canvas{width:auto;aspect-ratio:auto}
</style>
</head>
<body>
<canvas id="c" aria-label="Motion graphic: Accidental Deaths in Japan web app"></canvas>
<div class="ctl"><button id="pp">Pause</button><input id="scrub" type="range" min="0" max="10" step="0.001" value="0"><span id="tc">0.00 s</span></div>
<script src="engine.js"></script>
<script src="data.js"></script>
<script>
/* Explainer for https://semui01.github.io/japanjiko — "Accidental deaths in Japan, 1899–2025".
   Every number comes from data.js (written by data/prepare.py from the app's own data/*.csv). */
(() => {
'use strict';
const {clamp, lerp, prog, bell, E, hash, rgba, mix, mixRGB, glow, add, rrect, solveTime, flash} = M;

/* 1. Palette and type: the app's dark theme (docs/styles.css, prefers-color-scheme: dark). */
const C = {bg:'#0f1116', panel:'#171a21', fg:'#e7e9ee', muted:'#9aa1ae', line:'#2a2f39', grid:'#232832', axis:'#3a404c',
  refline:'#7c8492', mark:'#5d6573', dim:'#454b57', accent:'#6f97ea', bad:'#f07171', ok:'#5fbf8a',
  traffic:'#6f97ea', falls:'#eb9b55', drowning:'#3fbac6', choking:'#ab88dc', fire:'#e56b62', poisoning:'#97b856', other:'#8a93a1', quake:'#e56b62'};
Object.assign(T, {DISP:'"Gelasio", Georgia, serif', BODY:'"Inter", system-ui, sans-serif', MONO:'"Mono", ui-monospace, monospace', fg:C.fg, muted:C.muted, faint:'#5d6573'});
const JP = '"JP Sans", "Inter", sans-serif', JPS = '"JP Serif", "Gelasio", serif', UIJ = '"Inter", "JP Sans", sans-serif';
const W = 1920, H = 1080, DUR = 30.5;
const film = Film.create({W, H, FPS:60, DUR, bg:C.bg, fadeIn:.3});

/* 2. Master timing table. */
const TM = {
  sweep:[.1, 2.0], s1Out:3.0, zoom:[3.2, 4.2],
  s2Head:3.6, dash:[3.9, 4.3], added:4.2, light:[4.5, 5.7], cap:5.75, s2Out:7.15,
  split:[7.2, 7.55], morph:[7.85, 8.55], lines:[8.45, 9.05], labels:9.1, s3Head:7.75, s3Out:10.9,
  fade3:[10.95, 11.35], tealOut:[11.3, 11.7], s4Head:11.45, axis4:[11.72, 12.1], rings:12.15, rise:12.7, val:13.6, s4Out:14.85,
  bars5:15.25, s5Head:15.5, count5:[15.45, 16.4], dim5:[16.7, 17.1], s5Out:18.75,
  win:[19.15, 19.75], s6Head:19.3, subA:19.6, subAOut:22.35, subB:22.75, s6Out:25.2,
  clicks:[20.7, 21.5, 22.7, 23.85], toast:24.25, fly:[25.45, 26.05], fin:26.05, url:26.95, credit:27.15,
};
film.blur = [[TM.zoom[0], TM.zoom[1], 12], [TM.morph[0], TM.morph[1] + .1, 8], [TM.fly[0], TM.fly[1], 12]];

/* 3. Data and precomputed layout. */
const LR = DATA.longRun, BT = DATA.byType, F = DATA.facts, QK = new Set(F.quakes);
const TYPES = ['traffic', 'falls', 'drowning', 'choking'];
const fmt = v => Math.round(v).toLocaleString('en-US');
const BASE = 900, CHH = 520;

// S1→S3 chart: a right-anchored zoom from 1899–2025 (x 140–1780) to 1995–2025 (x 140–1640).
const zoomE = t => E.inOutCubic(prog(t, ...TM.zoom));
const xMapAt = t => { const e = zoomE(t), span = Math.exp(lerp(Math.log(127), Math.log(31), e)), R = lerp(1780, 1640, e);
  return {x: y => R - (2025.5 - y) / span * (R - 140), ppy: (R - 140) / span}; };
const vmaxAt = t => lerp(80000, 62000, zoomE(t));
const XS = xMapAt(99).x;                                    // final mapping (S2, S3)
const Y62 = v => BASE - v / 62000 * CHH, Y16 = v => BASE - v / 16000 * CHH;

// S1 playhead: when each yearly bar pops.
const sweepYear = t => 1898.6 + (2026.2 - 1898.6) * E.inOutSine(prog(t, ...TM.sweep));
const popT = new Map(LR.map(([y]) => [y, solveTime(sweepYear, y, ...TM.sweep)]));
// S2: 2009–2025 bars light up in turn.
const litT = y => TM.light[0] + (y - 2009) * (TM.light[1] - TM.light[0]) / 16;

function barBaseCol(y) { return QK.has(y) ? C.quake : C.accent; }
function barCol(y, t) {
  const base = barBaseCol(y), dimTo = QK.has(y) ? '#7a4a4a' : C.dim;
  let c = mixRGB(base, dimTo, E.inOutCubic(prog(t, 3.95, 4.45)));
  if (y >= 2009) c = mixRGB(c, base, E.outCubic(prog(t, litT(y), litT(y) + .25)));
  return c;
}

/* 4. Scenes. */
// ---------- S1–S3: one chart that zooms, recolours, splits and turns into lines (0 → 11.4 s)
film.scene(0, 12.0, (ctx, t) => {
  const xm = xMapAt(t), X = xm.x, vmax = vmaxAt(t), Yv = v => BASE - v / vmax * CHH, bw = xm.ppy * .72;
  const axisA = 1 - prog(t, TM.fade3[0] + .3, TM.fade3[1] + .4);
  // baseline
  ctx.save(); ctx.globalAlpha *= axisA; ctx.strokeStyle = C.axis; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(130, BASE + 1); ctx.lineTo(lerp(1790, 1650, zoomE(t)), BASE + 1); ctx.stroke(); ctx.restore();

  // S1 playhead glow
  if (t > TM.sweep[0] && t < TM.sweep[1] + .3) {
    const px = X(sweepYear(t)), a = bell(t, TM.sweep[0], TM.sweep[1] + .3);
    add(ctx, () => { const g = ctx.createLinearGradient(0, 380, 0, BASE); g.addColorStop(0, rgba(C.accent, 0)); g.addColorStop(1, rgba(C.accent, .5 * a)); ctx.fillStyle = g; ctx.fillRect(px - 1.5, 380, 3, BASE - 380); glow(ctx, px, BASE, 70, C.accent, .35 * a); });
  }
  const split = y => E.inOutCubic(prog(t, TM.split[0] + (y - 1995) * .011, TM.split[0] + (y - 1995) * .011 + .3));
  const morph = y => E.inOutCubic(prog(t, TM.morph[0] + (y - 1995) * .01, TM.morph[0] + (y - 1995) * .01 + .55));
  // bars
  if (t < TM.morph[1] + .5) for (const [y, v] of LR) {
    const pp = prog(t, popT.get(y), popT.get(y) + .35); if (pp <= 0) continue;
    const x = X(y), a = clamp((x - 120) / 30); if (a <= 0 || x > W + 40) continue;
    const h = v / vmax * CHH * E.outCubic(pp), w = Math.max(2, bw);
    ctx.save(); ctx.globalAlpha *= a;
    if (y >= 1995 && t >= TM.split[0]) {
      // S3: the yearly total splits into types, then each type collapses to a dot at its own value.
      const i = BT.years.indexOf(y), sp = split(y), mp = morph(y), col0 = barCol(y, t);
      let acc = 0;
      const segs = TYPES.map(k => ({k, v: BT[k][i]})); segs.push({k: 'rest', v: BT.total[i] - TYPES.reduce((s, k) => s + BT[k][i], 0)});
      for (const s of segs) {
        const y0 = Y62(acc + s.v), y1 = Y62(acc); acc += s.v;
        const tc = s.k === 'rest' ? C.dim : C[s.k], col = mix(col0, tc, sp);
        if (s.k === 'rest') { ctx.save(); ctx.globalAlpha *= 1 - mp; ctx.fillStyle = col; ctx.fillRect(x - w / 2, y0, w, y1 - y0 - (sp > 0 ? 1.2 * sp : 0)); ctx.restore(); continue; }
        if (mp <= 0) { ctx.fillStyle = col; ctx.fillRect(x - w / 2, y0, w, y1 - y0 - 1.2 * sp); continue; }
        const cy = lerp((y0 + y1) / 2, Y16(s.v), mp), hh = lerp(y1 - y0, 9, mp), ww = lerp(w, 9, mp);
        const fade = y === 2025 ? 1 : 1 - prog(t, TM.lines[0] + .2, TM.lines[1] + .1);
        ctx.save(); ctx.globalAlpha *= fade; ctx.fillStyle = col; rrect(ctx, x - ww / 2, cy - hh / 2, ww, hh, Math.min(4.5, hh / 2) * mp); ctx.fill(); ctx.restore();
      }
    } else {
      ctx.fillStyle = mix(barCol(y, t), barCol(y, t), 0);
      ctx.fillRect(x - w / 2, BASE - h, w, h);
    }
    // pop flash on the bar head (S1) and when a bar lights up (S2)
    const head = (1 - pp) * (pp > 0 ? 1 : 0) + (y >= 2009 ? bell(t, litT(y) - .02, litT(y) + .4) : 0);
    if (head > .01 && t < TM.split[0]) add(ctx, () => glow(ctx, x, BASE - h, 26 + bw, barBaseCol(y), .55 * head));
    ctx.restore();
  }
  // S1 axis years and earthquake labels
  const a1 = 1 - prog(t, TM.zoom[0], TM.zoom[0] + .35);
  [1900, 1950, 2000].forEach((y, k) => T.label(ctx, String(y), X(y), 938, `400 20px ${T.BODY}`, C.muted, a1 * prog(t, .25 + k * .5, .55 + k * .5), 'center'));
  [[1923, 71322], [2011, 59416]].forEach(([y, v]) => {
    const q = E.outCubic(prog(t, popT.get(y) + .15, popT.get(y) + .5)) * (1 - prog(t, TM.s1Out, TM.s1Out + .3));
    T.label(ctx, `${y} earthquake`, X(y), Yv(v) - 16 + (1 - q) * 8, `500 20px ${T.BODY}`, mix(C.quake, C.fg, .35), q, 'center');
  });
  // S2–S3 axis years and the 2008 marker
  const a2 = prog(t, TM.dash[0], TM.dash[1]) * (1 - prog(t, ...TM.fade3));
  [1995, 2025].forEach(y => T.label(ctx, String(y), XS(y), 938, `400 20px ${T.BODY}`, C.muted, a2, 'center'));
  const dp = E.outCubic(prog(t, ...TM.dash));
  if (dp > 0 && t < TM.fade3[1]) {
    const x8 = X(2008) + xm.ppy / 2;
    ctx.save(); ctx.globalAlpha *= 1 - prog(t, ...TM.fade3); ctx.strokeStyle = rgba(C.refline, .9); ctx.lineWidth = 2; ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.moveTo(x8, BASE); ctx.lineTo(x8, lerp(BASE, 360, dp)); ctx.stroke(); ctx.restore();
    const q = E.outCubic(prog(t, TM.added, TM.added + .3)) * (1 - prog(t, TM.s2Out, TM.s2Out + .3));
    T.label(ctx, '2009–2025 ADDED', x8 + 16 + (1 - q) * 10, 378, `500 21px ${T.MONO}`, C.accent, q, 'left', '2.5px');
  }
  // S2 counter: 2008 → 2025, value of the latest lit bar (computed from the frame time: no ghosting)
  const tq = M.frameT(t); let yr = 2008; for (let y = 2009; y <= 2025; y++) if (tq >= litT(y) + .1) yr = y;
  const val = LR.find(r => r[0] === yr)[1];
  const ca = prog(t, 4.35, 4.6) * (1 - prog(t, TM.s2Out, TM.s2Out + .3));
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha *= ca;
    T.tabular(ctx, fmt(val), 1780, 330, `400 100px ${T.DISP}`, C.fg, 56, 'right');
    T.tabular(ctx, String(yr), 1432, 330, `500 26px ${T.MONO}`, yr === 2025 ? C.accent : C.muted, 16, 'right');
    ctx.restore();
    const cq = E.outCubic(prog(t, TM.cap, TM.cap + .3)) * (1 - prog(t, TM.s2Out, TM.s2Out + .3));
    T.line(ctx, [{s:`+${F.vs2008}%`, f:`600 26px ${T.BODY}`, c:C.bad}, {s:' vs 2008', f:`400 26px ${T.BODY}`, c:C.muted}], 1780, 380, t, {t0:TM.cap, st:.04, rise:12, blur:8, align:'right', out:[TM.s2Out, .3]});
    void cq;
  }
  // S3 lines, end dots and end labels
  if (t >= TM.lines[0]) {
    const lp = prog(t, ...TM.lines), lx = lerp(XS(1995), XS(2025), E.inOutCubic(lp));
    const ends = {traffic:0, falls:0, drowning:0, choking:0};
    TYPES.forEach(k => {
      let a = 1 - prog(t, ...TM.fade3);
      if (k === 'drowning') a = 1 - prog(t, ...TM.tealOut);
      if (a <= 0) return;
      const glowK = k === 'drowning' ? bell(t, TM.fade3[0], TM.tealOut[1]) : 0;
      ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, k === 'drowning' ? 30 * E.inCubic(prog(t, ...TM.tealOut)) : 0);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, lx + 2, H); ctx.clip();
      ctx.strokeStyle = C[k]; ctx.lineWidth = 3.2 + glowK * 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (glowK > 0) { ctx.shadowColor = rgba(C[k], .8 * glowK); ctx.shadowBlur = 24; }
      ctx.beginPath(); BT.years.forEach((y, i) => { const px = XS(y), py = Y16(BT[k][i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); ctx.restore();
      const ex = XS(2025), ey = Y16(BT[k][BT.years.length - 1]);
      ctx.fillStyle = C[k]; ctx.beginPath(); ctx.arc(ex, ey, 5.5, 0, 7); ctx.fill();
      ctx.restore();
    });
    const names = {falls:'Falls', drowning:'Drowning', choking:'Choking', traffic:'Traffic'};
    ['falls', 'drowning', 'choking', 'traffic'].forEach((k, j) => {
      const q = E.outCubic(prog(t, TM.labels + j * .08, TM.labels + j * .08 + .3)) * (1 - prog(t, TM.s3Out, TM.s3Out + .3));
      const v = BT[k][BT.years.length - 1];
      T.label(ctx, `${names[k]} ${fmt(v)}`, XS(2025) + 18 + (1 - q) * 12, Y16(v) + 8, `600 23px ${T.BODY}`, C[k], q);
    });
  }
  // headlines S1–S3
  T.eyebrow(ctx, [{s:'MHLW', c:C.accent}, {s:' · VITAL STATISTICS OF JAPAN', c:C.muted}], 140, 132, t, .2, {size:22, out:[TM.s1Out, .3]});
  T.line(ctx, [{s:'Accidental deaths in ', f:`400 80px ${T.DISP}`, c:C.fg}, {s:'Japan,', f:`italic 400 80px ${T.DISP}`, c:C.fg}, {s:' 1899–2025', f:`400 80px ${T.DISP}`, c:C.accent}], 136, 228, t, {t0:.3, st:.07, out:[TM.s1Out + .05, .35]});
  T.line(ctx, [{s:'日本の不慮の事故死亡統計', f:`400 34px ${JPS}`, c:C.muted}], 140, 296, t, {t0:.85, out:[TM.s1Out + .05, .3]});
  T.line(ctx, [{s:'A 2009 ministry report, ', f:`400 72px ${T.DISP}`, c:C.fg}, {s:'extended to 2025', f:`italic 400 72px ${T.DISP}`, c:C.accent, glow:[C.accent, .35, 26]}], 136, 200, t, {t0:TM.s2Head, st:.065, out:[TM.s2Out, .35]});
  T.line(ctx, [{s:'Falls', f:`italic 400 72px ${T.DISP}`, c:C.falls}, {s:' and ', f:`400 72px ${T.DISP}`, c:C.fg}, {s:'drowning', f:`italic 400 72px ${T.DISP}`, c:C.drowning}, {s:' drove the rise', f:`400 72px ${T.DISP}`, c:C.fg}], 136, 200, t, {t0:TM.s3Head, st:.065, out:[TM.s3Out, .35]});
});

// ---------- S4: drowning rate per 100,000 by age, 2008 vs 2024
const AG = DATA.drownRates, AX0 = 300, AX1 = 1580, acx = i => AX0 + 128 + i * 256, Ya = v => BASE - v / 60 * CHH;
const riseT = i => TM.rise + i * .15;
film.scene(11.3, 15.6, (ctx, t) => {
  const ax = E.outCubic(prog(t, ...TM.axis4)), out = E.inCubic(prog(t, TM.s4Out, TM.s4Out + .4));
  ctx.save(); ctx.globalAlpha *= 1 - out;
  [0, 20, 40, 60].forEach(v => {
    ctx.save(); ctx.globalAlpha *= ax; ctx.strokeStyle = v ? C.grid : C.axis; ctx.lineWidth = v ? 1.5 : 2;
    ctx.beginPath(); ctx.moveTo(AX0, Ya(v)); ctx.lineTo(lerp(AX0, AX1, ax), Ya(v)); ctx.stroke(); ctx.restore();
    T.label(ctx, String(v), AX0 - 14, Ya(v) + 7, `400 19px ${T.BODY}`, C.muted, ax, 'right');
  });
  T.label(ctx, 'per 100,000', AX0, 350, `500 20px ${T.BODY}`, C.muted, E.outCubic(prog(t, TM.axis4[0] + .2, TM.axis4[1] + .2)));
  // legend
  const lg1 = E.outCubic(prog(t, TM.rings, TM.rings + .3)), lg2 = E.outCubic(prog(t, TM.rise, TM.rise + .3));
  if (lg1 > 0) { ctx.save(); ctx.globalAlpha *= lg1; ctx.strokeStyle = C.muted; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(AX1 - 196, 343, 8, 0, 7); ctx.stroke(); ctx.restore(); }
  T.label(ctx, '2008', AX1 - 180, 350, `500 20px ${T.BODY}`, C.muted, lg1);
  if (lg2 > 0) { ctx.save(); ctx.globalAlpha *= lg2; ctx.fillStyle = C.drowning; ctx.beginPath(); ctx.arc(AX1 - 76, 343, 9, 0, 7); ctx.fill(); ctx.restore(); }
  T.label(ctx, '2024', AX1 - 60, 350, `600 20px ${T.BODY}`, C.drowning, lg2);
  AG.forEach(([age, r08, r24], i) => {
    const x = acx(i);
    T.label(ctx, age, x, 944, `500 22px ${T.BODY}`, C.muted, E.outCubic(prog(t, TM.axis4[0] + .15 + i * .05, TM.axis4[0] + .45 + i * .05)), 'center');
    const pr = prog(t, TM.rings + i * .07, TM.rings + i * .07 + .35); if (pr <= 0) return;
    const ru = prog(t, riseT(i), riseT(i) + .55), rv = lerp(r08, r24, E.inOutCubic(ru)), y08 = Ya(r08), yv = Ya(rv);
    if (ru > 0) {
      ctx.strokeStyle = C.drowning; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y08 - 9); ctx.lineTo(x, Math.min(y08 - 9, yv + 6)); ctx.stroke();
      add(ctx, () => glow(ctx, x, yv, 60, C.drowning, .35 * (1 - prog(t, riseT(i) + .45, riseT(i) + 1.2))));
      ctx.fillStyle = C.drowning; ctx.beginPath(); ctx.arc(x, yv, 10 * E.outBack(clamp(ru * 3)), 0, 7); ctx.fill();
    }
    ctx.strokeStyle = C.muted; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y08, 9 * E.outBack(pr), 0, 7); ctx.stroke();
    ctx.strokeStyle = rgba(C.muted, .45 * (1 - pr)); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y08, 9 + 18 * E.outCubic(pr), 0, 7); ctx.stroke();
  });
  // 80–84 example values
  const i84 = 3, [, r08, r24] = AG[i84];
  T.line(ctx, [{s:String(r08), f:`500 24px ${T.BODY}`, c:C.muted}, {s:' → ', f:`500 24px ${T.BODY}`, c:C.muted}, {s:String(r24), f:`700 24px ${T.BODY}`, c:C.drowning}], acx(i84) + 26, (Ya(r08) + Ya(r24)) / 2 + 8, t, {t0:TM.val, st:.06, rise:10, blur:6, out:[TM.s4Out, .3]});
  ctx.restore();
  T.line(ctx, [{s:'Drowning', f:`italic 400 72px ${T.DISP}`, c:C.drowning, glow:[C.drowning, .3, 24]}, {s:' rates rose at every age 65–89', f:`400 72px ${T.DISP}`, c:C.fg}], 136, 200, t, {t0:TM.s4Head, st:.065, out:[TM.s4Out, .35]});
});

// ---------- S5: 2025 deaths by age group, stacked by type
const STK = DATA.age25.stack, ROWS = DATA.age25.rows;
const grp = (name, names) => { const rs = ROWS.filter(r => names.includes(r[0])); return {name, total: rs.reduce((s, r) => s + r[1], 0), segs: STK.map((k, j) => rs.reduce((s, r) => s + r[2 + j], 0))}; };
const G5 = [grp('Under 65', ['0', '1–4', '5–9', '10–14', '15–29', '30–44', '45–64']), grp('65–79', ['65–79']), grp('80 and over', ['80 and over'])];
const BX0 = 420, BX1 = 1640, bscale = (BX1 - BX0) / G5[2].total, rowY = i => 560 + i * 128, BHh = 76;
film.scene(15.2, 19.8, (ctx, t) => {
  const shrink = E.inOutCubic(prog(t, TM.s5Out, TM.s5Out + .45));
  ctx.save(); ctx.globalAlpha *= 1 - shrink;
  ctx.translate(960, 650); ctx.scale(1 - .25 * shrink, 1 - .25 * shrink); ctx.translate(-960, -650 + 40 * shrink);
  G5.forEach((g, i) => {
    const t0 = TM.bars5 + i * .14, gp = E.outCubic(prog(t, t0, t0 + .75)); if (prog(t, t0, t0 + .75) <= 0) return;
    const dim = i === 0 ? 1 - .55 * E.inOutCubic(prog(t, ...TM.dim5)) : 1, y = rowY(i), wTot = g.total * bscale * gp;
    ctx.save(); ctx.globalAlpha *= dim;
    let x = BX0;
    g.segs.forEach((v, j) => { const w = v * bscale; const vis = clamp(BX0 + wTot - x, 0, w); if (vis > 0) { ctx.fillStyle = C[STK[j]]; ctx.fillRect(x, y - BHh / 2, Math.max(0, vis - (vis === w && w > 3 ? 1.5 : 0)), BHh); } x += w; });
    ctx.restore();
    const lq = E.outCubic(prog(t, t0 + .1, t0 + .45)) * dim;
    T.label(ctx, g.name, BX0 - 24, y + 9, `500 26px ${T.BODY}`, C.fg, lq, 'right');
    const vq = E.outCubic(prog(t, t0 + .65, t0 + .95)) * dim;
    T.label(ctx, fmt(g.total), BX0 + g.total * bscale + 16, y + 9, `600 24px ${T.BODY}`, C.fg, vq);
  });
  // bracket over the two 65+ rows
